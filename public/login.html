<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login - Gestão Local</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
    <div class="auth-container login-size">
        <h2>🔒 Acesso ao Sistema</h2>
        <form id="formLogin">
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" id="log_email" required placeholder="Digite seu e-mail">
            </div>
            
            <div class="form-group">
                <label>Senha</label>
                <div class="password-wrapper">
                    <input type="password" id="log_senha" required placeholder="Digite sua senha">
                    <span class="toggle-password" onclick="togglePass('log_senha', this)">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </span>
                </div>
            </div>

            <!-- Lembrar de Mim -->
            <div style="margin-bottom: 15px; display: flex; align-items: center; gap: 8px;">
                <input type="checkbox" id="log_lembrar" style="width: 16px; height: 16px; cursor: pointer;">
                <label for="log_lembrar" style="font-size: 14px; color: #7f8c8d; cursor: pointer;">Lembrar de mim por 30 dias</label>
            </div>

            <button type="submit" class="btn-auth green">Entrar</button>
            
        </form>
        <div class="link-rodape">
            <a href="recuperar.html">Esqueci minha senha</a>
            <span>Não tem conta? <a href="registro.html">Crie uma agora</a></span>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
</body>
</html>
